name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        run: uv run --with pytest python -m pytest tests/ -q
      - name: acceptance mock gate
        run: uv run python scripts/acceptance.py --mock
